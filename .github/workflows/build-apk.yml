name: 构建 APK（定时记忆版）

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（不拉子模块，留到后面手动处理）
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: 修复子模块地址（替换为公开镜像）
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          sed -i 's|https://github.com/y39640068/media.git|https://github.com/rRemix/media.git|g' .gitmodules
          sed -i 's|https://github.com/y39640068/taglib.git|https://github.com/rRemix/taglib.git|g' .gitmodules
          git submodule sync
          git submodule update --init --recursive || true

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('&zwnj;**/*.gradle*', '**&zwnj;/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 准备 Python 并自动打"定时记忆"补丁
        run: |
          python3 tools/apply_memory_patch.py

      - name: 授权 gradlew 并构建 APK（CI Release 通道）
        run: |
          chmod +x gradlew
          ./gradlew assembleCiRelease

      - name: 收集产物
        run: |
          mkdir -p apk-output
          find app/build/outputs/apk -name "*.apk" -type f -exec cp {} apk-output/ \;
          ls -la apk-output/

      - name: 上传 APK 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: APlayer-定时记忆版-APK
          path: apk-output/*.apk
          retention-days: 30
