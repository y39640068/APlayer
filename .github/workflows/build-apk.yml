name: 构建 APK（定时记忆版）

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. 拉取源码（暂不拉子模块）
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: 2. 修复子模块地址并拉取
        run: |
          set -eux
          ls -la
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          sed -i 's|https://github.com/y39640068/media.git|https://github.com/rRemix/media.git|g' .gitmodules
          sed -i 's|https://github.com/y39640068/taglib.git|https://github.com/rRemix/taglib.git|g' .gitmodules
          cat .gitmodules
          git submodule sync
          git submodule update --init --recursive

      - name: 3. 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('&zwnj;**/*.gradle*', '**&zwnj;/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 5. 自动打定时记忆补丁
        run: |
          set -eux
          ls -la tools/
          python3 tools/apply_memory_patch.py

      - name: 6. 开始编译 APK
        run: |
          set -eux
          chmod +x gradlew
          ./gradlew assembleCiRelease

      - name: 7. 收集编译产物
        run: |
          set -eux
          mkdir -p apk-output
          find app/build/outputs/apk -name "*.apk" -type f -exec cp {} apk-output/ \;
          ls -la apk-output/

      - name: 8. 上传APK到下载区
        uses: actions/upload-artifact@v4
        with:
          name: APlayer-定时记忆版-APK
          path: apk-output/*.apk
          retention-days: 30
