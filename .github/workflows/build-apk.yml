name: 构建 APK（定时记忆版）

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 第一步：直接从国内GitCode公开镜像拉取完整源码（包含全部子模块，无需任何权限）
      - name: 1. 拉取完整源码（含子模块）
        run: |
          git clone https://gitcode.com/gh_mirrors/apla/APlayer.git . --recurse-submodules
          ls -la

      - name: 2. 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 缓存Gradle依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('&zwnj;**/*.gradle*', '**&zwnj;/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 4. 打定时记忆功能补丁
        run: |
          python3 tools/apply_memory_patch.py

      - name: 5. 编译可直接安装的Debug版APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 6. 收集APK产物
        run: |
          mkdir -p apk-output
          find app/build/outputs/apk -name "*.apk" -type f -exec cp {} apk-output/ \;
          ls -la apk-output/

      - name: 7. 上传APK供下载
        uses: actions/upload-artifact@v4
        with:
          name: APlayer-定时记忆版-APK
          path: apk-output/*.apk
          retention-days: 30
