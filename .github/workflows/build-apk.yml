name: 构建 APK（定时记忆版）

# 只保留手动触发：在你仓库的 Actions 页面点一下就能跑，不需要本地环境
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 打入「定时关闭记忆功能」补丁
        run: python3 tools/apply_memory_patch.py

      - name: 构建 APK
        run: ./gradlew app:assembleCiRelease --stacktrace --no-daemon

      - name: 上传 APK（构建完成后在本次运行的 Artifacts 里下载）
        uses: actions/upload-artifact@v4
        with:
          name: APlayer-定时记忆版-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
