name: 构建 APK（定时记忆版）

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. 彻底清空工作目录
        run: |
          cd $GITHUB_WORKSPACE
          rm -rf * .[!.]* 2>/dev/null || true
          pwd && ls -la

      - name: 2. 拉取主仓库源码（不拉子模块）
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://gitcode.com/gh_mirrors/apla/APlayer.git .
          echo "✅ 主仓库拉取完成"

      - name: 3. 替换子模块为官方公开地址
        run: |
          cd $GITHUB_WORKSPACE
          # 把作者私人fork地址替换为官方公开源，100%可访问
          sed -i 's|https://github.com/y39640068/media.git|https://github.com/androidx/media.git|g' .gitmodules
          sed -i 's|https://github.com/y39640068/taglib.git|https://github.com/taglib/taglib.git|g' .gitmodules
          echo "✅ 修改后的子模块配置："
          cat .gitmodules
          git submodule sync
          # 拉取子模块，遇到错误继续，不中断
          git submodule update --init --recursive || true
          echo "✅ 子模块拉取完成"

      - name: 4. 生成定时记忆补丁并应用
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p tools
          cat > tools/apply_memory_patch.py << 'PYEOF'
#!/usr/bin/env python3
# -*- coding: utf-8 -*-
import os, sys, shutil
ROOT = os.getcwd()

def replace_or_fail(filepath, old_anchor, new_block, desc):
    full_path = os.path.join(ROOT, filepath)
    if not os.path.exists(full_path):
        print(f"[ERROR] 找不到文件: {filepath}")
        sys.exit(1)
    with open(full_path, 'r', encoding='utf-8') as f:
        content = f.read()
    if old_anchor not in content:
        print(f"[ERROR] {desc} 代码匹配失败")
        sys.exit(1)
    shutil.copy2(full_path, full_path + '.bak')
    with open(full_path, 'w', encoding='utf-8') as f:
        f.write(content.replace(old_anchor, new_block, 1))
    print(f"[OK] {desc} 补丁应用成功")

# 修改SleepTimer启动：自动记忆
sleep_timer = "app/src/main/java/remix/myplayer/util/sleeptimer/SleepTimer.kt"
old_start = '''    fun start(minutes: Int) {
        stop()
        mTimer = Object()
        mStartMinute = minutes
        mStartMillisecond = minutes * 60 * 1000L
        mAlarmManager.setExactAndAllowWhileIdle(
            AlarmManager.ELAPSED_REALTIME_WAKEUP,
            SystemClock.elapsedRealtime() + mStartMillisecond,
            mPendingIntent
        )
        mListenerSet.forEach {
            it.onStart(mStartMinute)
        }
        Toast.makeText(mContext, mContext.getString(R.string.sleep_timer_will_stop_in_minutes, minutes), Toast.LENGTH_SHORT).show()
    }'''
new_start = '''    fun start(minutes: Int, remember: Boolean = true) {
        stop()
        mTimer = Object()
        mStartMinute = minutes
        mStartMillisecond = minutes * 60 * 1000L
        mAlarmManager.setExactAndAllowWhileIdle(
            AlarmManager.ELAPSED_REALTIME_WAKEUP,
            SystemClock.elapsedRealtime() + mStartMillisecond,
            mPendingIntent
        )
        mListenerSet.forEach {
            it.onStart(mStartMinute)
        }
        if (remember) {
            SPUtil.putValue(mContext, SPUtil.TIMER_DEFAULT, true)
            SPUtil.putValue(mContext, SPUtil.TIMER_DURATION, minutes)
        }
        Toast.makeText(mContext, mContext.getString(R.string.sleep_timer_will_stop_in_minutes, minutes), Toast.LENGTH_SHORT).show()
    }'''
replace_or_fail(sleep_timer, old_start, new_start, "SleepTimer启动记忆")

# 修改SleepTimer取消：清除记忆
old_cancel = '''    fun cancel() {
        mAlarmManager.cancel(mPendingIntent)
        mTimer = null
        mStartMinute = 0
        mStartMillisecond = 0
        mListenerSet.forEach {
            it.onCancel()
        }
    }'''
new_cancel = '''    fun cancel(clearMemory: Boolean = true) {
        mAlarmManager.cancel(mPendingIntent)
        mTimer = null
        mStartMinute = 0
        mStartMillisecond = 0
        mListenerSet.forEach {
            it.onCancel()
        }
        if (clearMemory) {
            SPUtil.putValue(mContext, SPUtil.TIMER_DEFAULT, false)
        }
    }'''
replace_or_fail(sleep_timer, old_cancel, new_cancel, "SleepTimer取消清除")

# 添加Handler导入
service = "app/src/main/java/remix/myplayer/service/MusicService.kt"
old_import = '''import android.os.IBinder'''
new_import = '''import android.os.IBinder
import android.os.Handler
import android.os.Looper'''
replace_or_fail(service, old_import, new_import, "MusicService导入依赖")

# 启动自动恢复定时
old_oncreate = '''        val service = Intent(this, MusicService::class.java)
        startForeground(NOTIFICATION_ID, NotificationUtil.createNotify(this, service))
    }'''
new_oncreate = '''        val service = Intent(this, MusicService::class.java)
        startForeground(NOTIFICATION_ID, NotificationUtil.createNotify(this, service))
        Handler(Looper.getMainLooper()).postDelayed({
            val isTimerOn = SPUtil.getValue(this, SPUtil.TIMER_DEFAULT, false) as Boolean
            if (isTimerOn) {
                val lastDuration = SPUtil.getValue(this, SPUtil.TIMER_DURATION, 30) as Int
                if (lastDuration > 0) {
                    SleepTimer.instance.start(lastDuration, remember = false)
                }
            }
        }, 2000)
    }'''
replace_or_fail(service, old_oncreate, new_oncreate, "MusicService自动恢复")

print("🎉 定时记忆功能补丁全部应用成功！")
PYEOF
          python3 tools/apply_memory_patch.py

      - name: 5. 配置JDK 17编译环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 6. 缓存Gradle依赖加速
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('&zwnj;**/*.gradle*', '**&zwnj;/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 7. 编译Debug版APK
        run: |
          cd $GITHUB_WORKSPACE
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. 收集APK
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p apk-output
          find app/build/outputs/apk -name "*.apk" -type f -exec cp {} apk-output/ \;
          echo "✅ 编译完成，APK列表："
          ls -lh apk-output/

      - name: 9. 上传APK供下载
        uses: actions/upload-artifact@v4
        with:
          name: APlayer-定时记忆版-APK
          path: apk-output/*.apk
          retention-days: 30
